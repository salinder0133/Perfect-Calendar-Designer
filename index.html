<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Perfect Calendar Designer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;400;500;600;700;800&family=Dancing+Script:wght@700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --accent-color: #00b894;
            --bg-light: #f4f7f6;
            --panel-bg: #ffffff;
            --text-main: #000000;
            --text-highlight: #ff0000;
            --font-calendar: 'Montserrat', sans-serif;
            --shadow-soft: 0 10px 25px rgba(0, 0, 0, 0.05);
            --radius-main: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            color: #2d3436;
            transition: background 0.3s, color 0.3s;
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #2d3436;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 28px;
            background: -webkit-linear-gradient(45deg, #6c5ce7, #00cec9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 14px;
            color: #636e72;
            font-weight: 500;
        }

        /* --- CONTROLS PANEL --- */
        .controls-panel {
            background: var(--panel-bg);
            padding: 25px;
            border-radius: var(--radius-main);
            box-shadow: var(--shadow-soft);
            width: 100%;
            max-width: 1100px;
            margin-bottom: 30px;
            z-index: 100;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .section-title {
            grid-column: 1 / -1;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #b2bec3;
            font-weight: 700;
            margin-bottom: 5px;
            margin-top: 10px;
            border-bottom: 1px solid #dfe6e9;
            padding-bottom: 5px;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 12px;
            font-weight: 600;
            color: #636e72;
            margin-left: 2px;
        }

        /* --- INPUTS --- */
        select,
        input[type="month"],
        input[type="number"],
        input[type="text"] {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #dfe6e9;
            background: #fdfdfd;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: #2d3436;
            width: 100%;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        select:focus,
        input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        /* --- UPDATED SMALL COLOR PICKER --- */
        .color-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .color-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .color-item span {
            font-size: 10px;
            color: #999;
            font-weight: 600;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 35px;
            height: 35px;
            /* Reduced height */
            border-radius: 8px;
            cursor: pointer;
            padding: 0;
            overflow: hidden;
            background: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border: 1px solid #eee;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 8px;
        }

        /* Range Slider */
        input[type="range"] {
            width: 100%;
            height: 4px;
            background: #dfe6e9;
            border-radius: 5px;
            outline: none;
            margin-top: 5px;
        }

        /* --- BUTTONS --- */
        .action-buttons {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #dfe6e9;
            justify-content: center;
        }

        .file-upload-label {
            background: white;
            color: var(--primary-color);
            border: 1px dashed var(--primary-color);
            padding: 0 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 40px;
            transition: 0.3s;
            width: 100%;
        }

        .file-upload-label:hover {
            background: rgba(108, 92, 231, 0.05);
        }

        .file-upload-label.uploaded {
            border-style: solid;
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        button {
            padding: 0 25px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            height: 40px;
            transition: all 0.3s;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .btn-dl {
            background: linear-gradient(135deg, #0984e3, #74b9ff);
            color: white;
        }

        .btn-dl-img {
            background: linear-gradient(135deg, #e17055, #fab1a0);
            color: white;
        }

        .btn-reset {
            background: #fff;
            color: #ff7675;
            border: 1px solid #ff7675;
        }

        .btn-reset:hover {
            background: #ff7675;
            color: white;
        }

        .btn-dark {
            background: #2d3436;
            color: white;
            position: absolute;
            top: 20px;
            right: 20px;
            height: 35px;
            padding: 0 15px;
            font-size: 11px;
        }

        /* --- PREVIEW AREA --- */
        .preview-area {
            width: 100%;
            max-width: 900px;
            background: #2d3436;
            padding: 30px;
            border-radius: 20px;
            display: none;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        #calendar-canvas {
            width: 794px;
            height: 1123px;
            background-color: white;
            position: relative;
            background-size: cover;
            background-position: center;
            transform-origin: top center;
            flex-shrink: 0;
            background-repeat: no-repeat;
            font-family: var(--font-calendar);
        }

        /* ========================================= */
        /* === DO NOT CHANGE BELOW - CALENDAR CSS === */
        /* ========================================= */

        .highlight-text {
            color: var(--text-highlight) !important;
            font-weight: 800;
        }

        .cal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            padding: 40px;
            color: var(--text-main);
            justify-content: flex-end;
        }

        .cal-box {
            padding: 30px;
            text-align: center;
            border-radius: 20px;
        }

        .style-glass .cal-box {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .style-luxury .cal-box {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #daa520;
            outline: 5px solid rgba(255, 255, 255, 0.5);
        }

        .style-bold .cal-box {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            color: white;
            width: 110%;
            margin-left: -5%;
        }

        .style-neon .cal-box {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #00f3ff;
            box-shadow: 0 0 20px #00f3ff;
            color: white;
        }

        .single-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .single-head {
            font-weight: bold;
            padding-bottom: 5px;
            border-bottom: 1px solid currentColor;
            text-transform: uppercase;
            font-size: 14px;
        }

        .single-date {
            font-size: 30px;
            font-weight: 600;
            padding: 5px;
        }

        .year-layout {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background: white;
        }

        .year-photo-zone {
            height: 40%;
            width: 100%;
            background-size: cover;
            background-position: center 50%;
            background-repeat: no-repeat;
            transition: background-position 0.1s;
        }

        .year-calendar-zone {
            height: 60%;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .year-style-glass .year-calendar-zone {
            background: #ffffff;
        }

        .year-style-luxury .year-calendar-zone {
            background: #fffbf0;
            color: #5c4d36;
        }

        .year-style-luxury .year-main-title {
            color: #daa520;
        }

        .year-style-bold .year-calendar-zone {
            background: #2d3436;
            color: white !important;
        }

        .year-style-neon .year-calendar-zone {
            background: #000000;
            color: #00f3ff !important;
        }

        .year-style-neon .year-main-title {
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .year-style-neon .highlight-text {
            color: #ff0055 !important;
            text-shadow: 0 0 5px #ff0055;
        }

        .year-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid currentColor;
        }

        .year-main-title {
            font-family: inherit;
            font-size: 60px;
            font-weight: 700;
            line-height: 1;
        }

        .year-subtitle {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.7;
        }

        .year-grid-system {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 20px 25px;
            flex-grow: 1;
        }

        .mini-month {
            display: flex;
            flex-direction: column;
        }

        .mini-month-name {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .mini-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            gap: 2px;
        }

        .mini-head {
            font-size: 9px;
            font-weight: 700;
            opacity: 0.6;
            margin-bottom: 2px;
        }

        .mini-num {
            font-size: 11px;
            font-weight: 500;
            padding: 1px 0;
        }

        .hidden {
            display: none !important;
        }

        input[type="file"] {
            display: none;
        }

        /* --- DARK MODE UI --- */
        body.dark-mode {
            background: #1e1e1e;
            color: #f5f5f5;
            --panel-bg: #2d3436;
        }

        body.dark-mode h1 {
            background: -webkit-linear-gradient(45deg, #a29bfe, #81ecec);
            -webkit-background-clip: text;
        }

        body.dark-mode .controls-panel {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
        }

        body.dark-mode .section-title {
            color: #636e72;
            border-color: #444;
        }

        body.dark-mode .control-group label {
            color: #dfe6e9;
        }

        body.dark-mode select,
        body.dark-mode input {
            background: #383e42;
            color: white;
            border-color: #555;
        }

        body.dark-mode .file-upload-label {
            background: #383e42;
            border-color: #6c5ce7;
            color: #a29bfe;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .controls-panel {
                padding: 15px;
            }

            .btn-dark {
                top: 10px;
                right: 10px;
                position: absolute;
            }

            h1 {
                margin-top: 40px;
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <button class="btn-dark" id="darkModeBtn" onclick="toggleDarkMode()">
        <i class="fas fa-moon"></i> Dark
    </button>

    <header>
        <h1><i class="fas fa-calendar-alt"></i> Pro Calendar Designer</h1>
        <p class="subtitle">Create beautiful printable calendars in seconds.</p>
    </header>

    <div class="controls-panel">

        <div class="controls-grid">
            <div class="section-title">1. Setup</div>

            <div class="control-group">
                <label>Mode</label>
                <select id="modeSelect" onchange="toggleMode()">
                    <option value="single">Single Month</option>
                    <option value="year">Full Year</option>
                </select>
            </div>

            <div class="control-group">
                <label>Date / Year</label>
                <input type="month" id="monthInput" oninput="liveUpdate()">
                <input type="number" id="yearInput" class="hidden" placeholder="2025" value="2025"
                    oninput="liveUpdate()">
            </div>

            <div class="control-group">
                <label>Photo</label>
                <label class="file-upload-label" id="uploadLabel">
                    <i class="fas fa-cloud-upload-alt"></i> Select
                    <input type="file" id="photoInput" accept="image/*" onchange="handleFile(this)">
                </label>
            </div>

            <div class="section-title">2. Style</div>

            <div class="control-group">
                <label>Theme</label>
                <select id="styleSelect" onchange="liveUpdate()">
                    <option value="glass">💎 Glass Modern</option>
                    <option value="luxury">✨ Luxury Gold</option>
                    <option value="bold">🎨 Bold Magazine</option>
                    <option value="neon">🟣 Neon Cyberpunk</option>
                </select>
            </div>

            <div class="control-group">
                <label>Font</label>
                <select id="fontSelect" onchange="liveUpdate()">
                    <option value="'Montserrat', sans-serif">Modern Sans</option>
                    <option value="'Playfair Display', serif">Elegant Serif</option>
                    <option value="'Dancing Script', cursive">Handwritten</option>
                </select>
            </div>

            <div class="control-group">
                <label>Colors</label>
                <div class="color-row">
                    <div class="color-item">
                        <span>Text</span>
                        <input type="color" id="textColor" value="#000000" oninput="liveUpdate()">
                    </div>
                    <div class="color-item">
                        <span>Holiday</span>
                        <input type="color" id="highlightColor" value="#ff0000" oninput="liveUpdate()">
                    </div>
                </div>
            </div>

            <div class="control-group" id="posGroup">
                <label>Position</label>
                <select id="posSelect" onchange="liveUpdate()">
                    <option value="flex-end">Bottom</option>
                    <option value="center">Center</option>
                    <option value="flex-start">Top</option>
                </select>
            </div>

            <div class="control-group hidden" id="photoPosGroup">
                <label>Photo Y</label>
                <input type="range" id="photoPosY" min="0" max="100" value="50" oninput="liveUpdate()">
            </div>

            <div class="control-group hidden" id="photoZoomGroup">
                <label>Zoom</label>
                <input type="range" id="photoZoom" min="100" max="250" value="100" oninput="liveUpdate()">
            </div>

            <div class="action-buttons">
                <button class="btn-dl-img hidden" id="downloadImgBtn" onclick="downloadImage()">
                    <i class="fas fa-image"></i> JPG
                </button>
                <button class="btn-dl hidden" id="downloadBtn" onclick="downloadPDF()">
                    <i class="fas fa-file-pdf"></i> PDF
                </button>
                <button class="btn-reset" onclick="resetAll()">
                    <i class="fas fa-redo"></i> Reset
                </button>
            </div>
        </div>
    </div>

    <div class="preview-area" id="previewArea">
        <div id="calendar-canvas"></div>
    </div>

    <script>
        const canvas = document.getElementById('calendar-canvas');
        const previewArea = document.getElementById('previewArea');
        const monthInput = document.getElementById('monthInput');
        const yearInput = document.getElementById('yearInput');
        const styleSelect = document.getElementById('styleSelect');
        const fontSelect = document.getElementById('fontSelect');
        const posSelect = document.getElementById('posSelect');
        const modeSelect = document.getElementById('modeSelect');
        const textColorInput = document.getElementById('textColor');
        const highlightColorInput = document.getElementById('highlightColor');
        const uploadLabel = document.getElementById('uploadLabel');
        const photoInput = document.getElementById('photoInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadImgBtn = document.getElementById('downloadImgBtn');
        const posGroup = document.getElementById('posGroup');
        const photoPosGroup = document.getElementById('photoPosGroup');
        const photoZoomGroup = document.getElementById('photoZoomGroup');

        const now = new Date();
        monthInput.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

        let currentPhoto = null;
        let futureWarningAccepted = false;




        if (localStorage.getItem('calTheme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
        window.addEventListener('load', () => {
            const btn = document.getElementById('darkModeBtn');
            if (btn) {
                const isDark = document.body.classList.contains('dark-mode');
                btn.innerHTML = isDark ? '<i class="fas fa-sun"></i> Light' : '<i class="fas fa-moon"></i> Dark';
            }
        });

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const btn = document.getElementById('darkModeBtn');
            const isDark = document.body.classList.contains('dark-mode');

            localStorage.setItem('calTheme', isDark ? 'dark' : 'light');

            btn.innerHTML = isDark ? '<i class="fas fa-sun"></i> Light' : '<i class="fas fa-moon"></i> Dark';
        }

        const fixedHolidays = ["1-1", "1-14", "1-26", "2-14", "4-14", "5-1", "8-15", "10-2", "11-14", "12-25"];
        const variableHolidays = {
            "2024": ["3-8", "3-25", "4-11", "4-17", "6-17", "8-19", "9-7", "10-12", "11-1"],
            "2025": ["2-26", "3-14", "3-31", "4-18", "8-9", "8-16", "8-27", "10-20", "11-5"],
            "2026": ["2-15", "3-4", "3-20", "4-3", "8-28", "9-4", "9-14", "11-8", "11-24"],
            "2027": ["3-22", "4-10", "8-2", "8-24", "10-2", "10-29", "11-12"],
            "2028": ["3-11", "3-29", "7-21", "8-13", "10-8", "10-17", "11-1"],
            "2029": ["3-1", "3-18", "7-11", "8-2", "9-27", "10-7", "11-5"],
            "2030": ["3-19", "4-6", "6-30", "8-21", "10-5", "10-26", "11-9"]

        };

        function toggleMode() {
            if (modeSelect.value === 'single') {
                monthInput.classList.remove('hidden');
                yearInput.classList.add('hidden');
                posGroup.style.display = 'flex';
                photoPosGroup.classList.add('hidden');
                photoZoomGroup.classList.add('hidden');
            } else {
                monthInput.classList.add('hidden');
                yearInput.classList.remove('hidden');
                posGroup.style.display = 'none';
                if (currentPhoto) {
                    photoPosGroup.classList.remove('hidden');
                    photoZoomGroup.classList.remove('hidden');
                }
            }
            if (currentPhoto) generateCalendar();
        }

        function handleFile(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    currentPhoto = e.target.result;
                    uploadLabel.classList.add('uploaded');
                    uploadLabel.innerHTML = '<i class="fas fa-check"></i> Loaded';
                    if (modeSelect.value === 'year') {
                        photoPosGroup.classList.remove('hidden');
                        photoZoomGroup.classList.remove('hidden');
                    }
                    generateCalendar();
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function liveUpdate() { if (currentPhoto) generateCalendar(); }

        function isHoliday(year, month, day) {
            const key = `${month + 1}-${day}`;
            if (fixedHolidays.includes(key)) return true;
            const yStr = year.toString();
            if (variableHolidays[yStr] && variableHolidays[yStr].includes(key)) return true;
            return false;
        }

        function generateCalendar() {
            if (!currentPhoto) return;
            const style = styleSelect.value;
            const mode = modeSelect.value;
            const position = posSelect.value;
            const color = textColorInput.value;
            const hlColor = highlightColorInput.value;
            const font = fontSelect.value;
            const photoY = document.getElementById('photoPosY').value;
            const photoZ = document.getElementById('photoZoom').value;

            if (mode === 'year') {
                const yearVal = parseInt(yearInput.value);
                if (yearVal > 2030 && !futureWarningAccepted) {
                    if (confirm("Holidays only up to 2030. Continue?")) futureWarningAccepted = true;
                    else return;
                }
            }

            document.documentElement.style.setProperty('--text-main', color);
            document.documentElement.style.setProperty('--text-highlight', hlColor);
            document.documentElement.style.setProperty('--font-calendar', font);

            canvas.className = `year-style-${style}`;
            canvas.innerHTML = '';
            previewArea.style.display = 'flex';
            fitPreview();

            if (mode === 'single') {
                canvas.className = `style-${style}`;
                canvas.style.backgroundImage = `url(${currentPhoto})`;
                canvas.style.backgroundPosition = 'center center';
                if (!monthInput.value) return;
                renderSingle(monthInput.value, position, style);
            } else {
                canvas.style.backgroundImage = 'none';
                if (!yearInput.value) return;
                renderYear(yearInput.value, style, photoY, photoZ);
            }
            downloadBtn.classList.remove('hidden');
            downloadImgBtn.classList.remove('hidden');
        }

        function renderSingle(val, position, style) {
            const [year, month] = val.split('-');
            const date = new Date(year, month - 1, 1);
            const totalDays = new Date(year, month, 0).getDate();
            const firstDay = date.getDay();
            let html = `<div class="cal-overlay" style="justify-content: ${position};"><div class="cal-box">`;
            html += `<div style="font-size:60px; font-weight:800; line-height:1; margin-bottom:10px;">${date.toLocaleString('default', { month: 'long' })}</div>`;
            html += `<div style="font-size:20px; letter-spacing:5px; margin-bottom:20px;">${year}</div><div class="single-grid">`;
            ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach((d, i) => html += `<div class="single-head ${i === 0 ? 'highlight-text' : ''}">${d}</div>`);
            for (let i = 0; i < firstDay; i++) html += `<div></div>`;
            for (let i = 1; i <= totalDays; i++) {
                let cls = (new Date(year, month - 1, i).getDay() === 0 || isHoliday(year, month - 1, i)) ? "single-date highlight-text" : "single-date";
                html += `<div class="${cls}">${i}</div>`;
            }
            html += `</div></div></div>`;
            canvas.innerHTML = html;
        }

        function renderYear(year, style, photoY, photoZ) {
            let html = `<div class="year-layout"><div class="year-photo-zone" style="background-image: url(${currentPhoto}); background-position: center ${photoY}%; background-size: ${photoZ}%"></div>`;
            html += `<div class="year-calendar-zone"><div class="year-header"><div class="year-main-title">${year}</div><div class="year-subtitle">Calendar Collection</div></div><div class="year-grid-system">`;
            for (let m = 0; m < 12; m++) {
                const d = new Date(year, m, 1);
                const tDays = new Date(year, m + 1, 0).getDate();
                const fDay = d.getDay();
                html += `<div class="mini-month"><div class="mini-month-name">${d.toLocaleString('default', { month: 'long' })}</div><div class="mini-days">`;
                ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach((x, i) => html += `<div class="mini-head ${i === 0 ? 'highlight-text' : ''}">${x}</div>`);
                html += `<span></span>`.repeat(fDay);
                for (let i = 1; i <= tDays; i++) {
                    let cls = (new Date(year, m, i).getDay() === 0 || isHoliday(year, m, i)) ? "mini-num highlight-text" : "mini-num";
                    html += `<div class="${cls}">${i}</div>`;
                }
                html += `</div></div>`;
            }
            html += `</div></div></div>`;
            canvas.innerHTML = html;
        }

        function resetAll() { window.location.reload(); }
        function fitPreview() {
            const w = window.innerWidth - 40;
            const s = w < 840 ? w / 820 : 1;
            canvas.style.transform = `scale(${s})`;
            previewArea.style.height = `${(1123 * s) + 40}px`;
        }
        window.addEventListener('resize', fitPreview);
        window.addEventListener('load', fitPreview);

        async function downloadPDF() {
            const btn = document.getElementById('downloadBtn');
            const txt = btn.innerHTML;
            btn.innerHTML = '...';
            const t = canvas.style.transform;
            canvas.style.transform = "none";
            window.scrollTo(0, 0);
            await new Promise(r => setTimeout(r, 200));
            const c = await html2canvas(canvas, { scale: 2, useCORS: true, allowTaint: true });
            canvas.style.transform = t;
            const pdf = new window.jspdf.jsPDF('p', 'mm', 'a4');
            pdf.addImage(c.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 210, 297);
            pdf.save(`Cal-${Date.now()}.pdf`);
            btn.innerHTML = txt;
        }

        async function downloadImage() {
            const btn = document.getElementById('downloadImgBtn');
            const txt = btn.innerHTML;
            btn.innerHTML = '...';
            const t = canvas.style.transform;
            canvas.style.transform = "none";
            window.scrollTo(0, 0);
            await new Promise(r => setTimeout(r, 200));
            const c = await html2canvas(canvas, { scale: 2, useCORS: true, allowTaint: true });
            canvas.style.transform = t;
            const l = document.createElement('a');
            l.download = `Cal-${Date.now()}.jpg`;
            l.href = c.toDataURL('image/jpeg', 0.9);
            l.click();
            btn.innerHTML = txt;
        }
    </script>
</body>

</html>
